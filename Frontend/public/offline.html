<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar - Connection Lost</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-bottom: 2rem;
      font-style: italic;
    }
    .status {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 2rem;
      color: rgba(255, 255, 255, 0.8);
    }
    .btn {
      padding: 1rem 2.5rem;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: opacity 0.3s ease;
    }
    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="logo">LUNAR.</div>
  <div class="status">DISCONNECTED</div>
  <h1>You are currently offline.</h1>
  <a href="/" class="btn" onclick="window.location.reload(); return false;">Retry Connection</a>
</body>
</html>
